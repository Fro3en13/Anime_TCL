name: Build TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Auto-fix folder & Build APK
        run: |
          # Если в имени папки русская буква или лишний символ — переименовываем в чистую латинскую 'app'
          for d in *; do
            if [ -d "$d" ] && [ "$d" != "app" ] && [ "$d" != ".git" ] && [ "$d" != ".github" ]; then
              echo "Исправляем имя папки '$d' на латинскую 'app'..."
              mv "$d" app
              break
            fi
          done

          # Собираем APK
          gradle :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeTV-Release
          path: app/build/outputs/apk/release/*.apk
