name: Build TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # Проверяем структуру и сразу пробуем собрать
      - name: Diagnostic & Build
        run: |
          echo "=== 1. Проверяем корень ==="
          ls -la
          echo "=== 2. Проверяем папку app ==="
          ls -la app/
          echo "=== 3. Проверяем settings.gradle ==="
          cat settings.gradle
          echo "=== 4. Список доступных задач в :app ==="
          gradle :app:tasks --all || true
          echo "=== 5. Запуск сборки ==="
          gradle :app:assemble --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeTV-Release
          path: app/build/outputs/apk/**/*.apk
